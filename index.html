<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="本言">
<meta name="theme-color" content="#1f6f5c">
<title>本言</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>本言</h1><nav>
  <button class="tab on" data-tab="talk">说话</button>
  <button class="tab" data-tab="dict">词典</button>
  <button class="tab" data-tab="hist">历史</button>
  <button class="tab" data-tab="set">设置</button>
</nav></header>

<main>
<section id="talk" class="pane on">
  <label class="lbl" for="out">整理后</label>
  <textarea id="out" rows="6" readonly placeholder="点下面的麦克风说话，整理好的文字会出现在这里。"></textarea>
  <button id="copyBtn" class="btn big">复制</button>
  <p id="status" class="status" role="status"></p>
  <details id="more">
    <summary>原话与语气</summary>
    <div class="tones" id="tones"></div>
    <label class="lbl" for="raw">原话（也可用 iPhone 键盘上的麦克风输入或修改）</label>
    <textarea id="raw" rows="4" placeholder="在这里说或打字……"></textarea>
    <div class="row"><button id="polishBtn" class="btn">整理</button><button id="clearBtn" class="btn ghost">清空</button></div>
  </details>
</section>

<section id="dict" class="pane">
  <p class="hint">把你说的词换成要写的词，只存在这台手机上。圣经词库（<span id="faithCount"></span> 个词）已内置，不用添加。</p>
  <div class="row"><input id="spoken" placeholder="说成"><input id="written" placeholder="写成"></div>
  <button id="addEntry" class="btn">添加</button>
  <ul id="entries" class="list"></ul>
</section>

<section id="hist" class="pane">
  <button id="clearHist" class="btn ghost">清空历史</button>
  <ul id="history" class="list"></ul>
</section>
<section id="set" class="pane">
  <h2 class="h2">AI 整理（DeepSeek）</h2>
  <p class="hint">说完后先用本地规则立即整理，再把原话发给 DeepSeek 精修。密钥只存在这台手机的浏览器里，不会上传到别处。</p>
  <label class="sw"><input type="checkbox" id="aiOn"> 使用 AI 整理</label>
  <p class="hint">当前密钥：<b id="keyMask">未设置</b></p>
  <input id="keyInput" type="password" autocomplete="off" placeholder="粘贴 DeepSeek API Key（sk-…）">
  <div class="row"><button id="saveKey" class="btn">保存</button><button id="clearKey" class="btn ghost">清除密钥</button></div>
</section>
</main>
<footer id="bar"><button id="mic" aria-label="点一下开始说话">🎙️<span id="micLabel">点一下开始说话</span></button></footer>
<script src="polisher.js"></script>
<script src="app.js"></script>
</body>
</html>
